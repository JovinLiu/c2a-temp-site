<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>C2A Agreement Login</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #eef1f4;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eef1f4;
      }
      .login-card {
        width: min(390px, 100%);
        padding: 32px;
        background: #fff;
        border: 1px solid #d8dee3;
        border-radius: 14px;
        box-shadow: 0 18px 50px rgba(21, 33, 41, 0.12);
      }
      h1 {
        margin: 0 0 7px;
        font-size: 22px;
        text-align: center;
      }
      p {
        margin: 0 0 23px;
        color: #67737c;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 700;
      }
      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #c8d0d6;
        border-radius: 8px;
        outline: none;
        font: inherit;
      }
      input:focus {
        border-color: #317388;
        box-shadow: 0 0 0 3px rgba(49, 115, 136, 0.15);
      }
      button {
        width: 100%;
        min-height: 44px;
        margin-top: 13px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #1f5f73;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled { opacity: .65; cursor: wait; }
      .error {
        min-height: 20px;
        margin: 11px 0 0;
        color: #a33a3a;
        text-align: left;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>C2A Agreement Editor</h1>
      <p>Enter the private access password to open the agreement editors.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button id="submit-button" type="submit">Open editor</button>
        <div class="error" id="error-message" role="alert" aria-live="polite"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('password');
      const submitButton = document.getElementById('submit-button');
      const errorMessage = document.getElementById('error-message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMessage.textContent = '';
        submitButton.disabled = true;
        submitButton.textContent = 'Checking…';

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(result.message || 'Unable to sign in.');
          }

          const params = new URLSearchParams(window.location.search);
          const returnTo = params.get('returnTo');
          const safeReturnTo = returnTo && returnTo.startsWith('/') && !returnTo.startsWith('//')
            ? returnTo
            : '/';
          window.location.replace(safeReturnTo);
        } catch (error) {
          errorMessage.textContent = error.message || 'Incorrect password.';
          passwordInput.select();
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Open editor';
        }
      });
    </script>
  </body>
</html>
